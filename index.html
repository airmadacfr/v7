<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweet Screenshot</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--gold:#C9A84C;--gold-l:#F0D080;--dark:#0A0A0A;--d2:#111;--d3:#1A1A1A;--d4:#252525;--w:#F5F5F0;--grey:#888;--green:#22C55E;--red:#EF4444;--tb:#15202b;--tbr:#2f3336;--tt:#e7e9ea;--tm:#71767b;--tbl:#1d9bf0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--dark);color:var(--w);font-family:"DM Sans",sans-serif;min-height:100vh}
.hdr{border-bottom:1px solid #222;padding:16px 32px;display:flex;align-items:center;gap:14px;background:var(--d2)}
.hdr-logo{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0}
.hdr-logo img{width:100%;height:100%;object-fit:cover}
.hdr-t{font-family:"Bebas Neue",sans-serif;font-size:20px;letter-spacing:1px}
.hdr-s{font-size:11px;color:var(--grey);margin-top:1px}
.main{max-width:920px;margin:0 auto;padding:28px 22px 110px}
.info{background:#0d0d00;border:1px solid #2a2500;border-left:3px solid var(--gold);border-radius:8px;padding:11px 16px;font-size:12px;color:#999;line-height:1.8;margin-bottom:22px}
.info strong{color:var(--gold-l)}
.paste-box{background:var(--d2);border:1.5px dashed #2e2e2e;border-radius:12px;padding:18px;margin-bottom:16px;transition:border-color .2s}
.paste-box:focus-within{border-color:var(--gold)}
.lbl{font-size:11px;color:var(--grey);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
textarea{width:100%;background:var(--d3);border:1px solid #2a2a2a;border-radius:8px;padding:11px 14px;color:var(--w);font-family:"DM Sans",sans-serif;font-size:14px;resize:vertical;min-height:96px;outline:none;line-height:1.6;transition:border-color .2s}
textarea:focus{border-color:var(--gold)}
textarea::placeholder{color:#3a3a3a}
.hint{font-size:11px;color:#555;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.bp{background:var(--gold);color:var(--dark);border:none;border-radius:8px;padding:11px 22px;font-family:"DM Sans",sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.bp:hover{background:var(--gold-l);transform:translateY(-1px)}
.bp:disabled{opacity:.4;cursor:not-allowed;transform:none}
.bs{background:var(--d4);color:var(--w);border:1px solid #333;border-radius:8px;padding:9px 16px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.bs:hover{border-color:var(--gold);color:var(--gold)}
.bs:disabled{opacity:.4;cursor:not-allowed}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-t{font-family:"Bebas Neue",sans-serif;font-size:19px;letter-spacing:1px;color:var(--gold)}
.bdg{background:var(--d3);padding:3px 11px;border-radius:20px;font-size:12px;color:var(--grey)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--d2);border:1px solid #1e1e1e;border-radius:13px;overflow:hidden;transition:border-color .2s,box-shadow .2s,opacity .2s;cursor:grab;user-select:none}
.card:hover{border-color:#2e2e2e;box-shadow:0 4px 22px rgba(0,0,0,.45)}
.card.dragging{opacity:.4;cursor:grabbing}
.card.drag-over{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.card-top{padding:11px 14px 3px;display:flex;align-items:center;gap:6px}
.drag-handle{color:#444;font-size:14px;cursor:grab;padding:2px 4px}
.pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500}
.obadge{margin-left:auto;background:var(--d4);color:var(--grey);font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-load{background:var(--gold);animation:pulse 1s infinite}
.d-ok{background:var(--green)}
.d-err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.card-url{padding:0 14px 7px;font-size:10px;color:#383838;font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body{padding:6px 10px 8px}
.card-actions{padding:8px 14px 12px;border-top:1px solid #191919;display:flex;gap:7px;flex-wrap:wrap}
.ph{padding:26px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;color:#555;font-size:12px}
.spin{width:20px;height:20px;border:2px solid #222;border-top-color:var(--gold);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{background:var(--tb);border:1px solid var(--tbr);border-radius:12px;padding:14px 16px;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;width:100%}
.tw-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px}
.tw-av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#273340}
.tw-av img{width:100%;height:100%;object-fit:cover;display:block}
.tw-name{font-size:13px;font-weight:700;color:var(--tt);display:flex;align-items:center;gap:4px}
.tw-ck{color:var(--tbl);font-size:13px}
.tw-handle{font-size:12px;color:var(--tm);margin-top:1px}
.tw-xlogo{font-weight:900;font-size:18px;color:var(--tt);margin-left:auto;flex-shrink:0}
.tw-body{font-size:13px;line-height:1.5;color:var(--tt);margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.bl{color:var(--tbl)}
.tw-date{font-size:11px;color:var(--tm);padding-top:8px;border-top:1px solid var(--tbr);margin-bottom:8px}
.tw-stats{display:flex;gap:14px;padding-top:8px;border-top:1px solid var(--tbr)}
.tw-stat{font-size:12px;color:var(--tm)}
.sticky{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.97);border-top:1px solid #222;backdrop-filter:blur(12px);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:200}
.sticky-info{font-size:13px;color:var(--grey)}
.sticky-info strong{color:var(--w)}
.sticky-r{display:flex;gap:8px;flex-shrink:0}
.toast{position:fixed;top:20px;right:20px;background:var(--d2);border:1px solid var(--gold);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--w);transform:translateY(-80px);opacity:0;transition:all .3s;z-index:300}
.toast.show{transform:translateY(0);opacity:1}
#stage{position:fixed;left:-9999px;top:0;width:405px;background:transparent;z-index:-1;pointer-events:none}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-logo"><img src="/logo.png" alt="Logo"></div>
  <div>
    <div class="hdr-t">Tweet Screenshot Tool</div>
    <div class="hdr-s">@RMadrid_actu</div>
  </div>
</div>
<div class="main">
  <div class="info">
    <strong>Mode d'emploi :</strong> Colle tes liens ci-dessous, clique Charger, puis Capturer tout.<br>
    Drag &amp; drop pour reordonner. ZIP avec date automatique.
  </div>
  <div class="paste-box">
    <div class="lbl">Liens de tweets</div>
    <textarea id="urls" placeholder="https://x.com/RMadrid_actu/status/..."></textarea>
    <div class="hint">Un lien par ligne. x.com et twitter.com acceptes.</div>
  </div>
  <div class="row">
    <button class="bp" id="btn-load">&#128640; Charger les tweets</button>
    <button class="bs" id="btn-clear">&#128465; Effacer</button>
  </div>
  <div id="sec" style="display:none">
    <div class="sec-hdr">
      <span class="sec-t">Apercus</span>
      <span class="bdg" id="cnt"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div id="stage"></div>
<div class="toast" id="toast">Lien colle automatiquement</div>
<div class="sticky">
  <div class="sticky-info" id="sinfo">Aucun tweet charge</div>
  <div class="sticky-r">
    <button class="bs" id="cap-btn" style="display:none">&#128247; Capturer tout</button>
    <button class="bp" id="dl-btn" style="display:none">&#8659; Telecharger ZIP</button>
  </div>
</div>
<script>
var LOGO = "/logo.png";
var shots = {};
var cache = {};
var tweetOrder = [];
var dragSrc = null;

document.getElementById("btn-load").addEventListener("click", loadAll);
document.getElementById("btn-clear").addEventListener("click", clearAll);
document.getElementById("cap-btn").addEventListener("click", captureAll);
document.getElementById("dl-btn").addEventListener("click", dlZip);

window.addEventListener("focus", tryPaste);
document.addEventListener("visibilitychange", function() { if (!document.hidden) tryPaste(); });

function tryPaste() {
  if (!navigator.clipboard || !navigator.clipboard.readText) return;
  navigator.clipboard.readText().then(function(text) {
    if (!text) return;
    if (!/(?:twitter\.com|x\.com)\/[^\/]+\/status\/\d+/.test(text)) return;
    var ta = document.getElementById("urls");
    var clean = text.split("?")[0].split("#")[0];
    if (ta.value.indexOf(clean) !== -1) return;
    ta.value = ta.value.trim() ? ta.value.trim() + "
" + text.trim() : text.trim();
    showToast("Lien colle automatiquement !");
  }).catch(function() {});
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 2800);
}

function parseUrls(raw) {
  var lines = raw.split("
");
  var result = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var clean = line.split("?")[0].split("#")[0];
    var m = clean.match(/(?:twitter\.com|x\.com)\/([^\/]+)\/status\/(\d+)/);
    if (m) result.push({ id: m[2], handle: m[1] });
  }
  return result;
}

function loadAll() {
  var tweets = parseUrls(document.getElementById("urls").value);
  if (!tweets.length) { alert("Aucun lien valide trouve."); return; }
  document.getElementById("grid").innerHTML = "";
  document.getElementById("sec").style.display = "block";
  shots = {}; cache = {};
  tweetOrder = tweets.map(function(t) { return t.id; });
  updateUI();
  for (var i = 0; i < tweets.length; i++) {
    makeCard(tweets[i]);
    fetchTweet(tweets[i]);
  }
}

function makeCard(t) {
  var grid = document.getElementById("grid");
  var d = document.createElement("div");
  d.className = "card";
  d.id = "c-" + t.id;
  d.draggable = true;
  d.dataset.id = t.id;
  var idx = tweetOrder.indexOf(t.id) + 1;
  d.innerHTML = 
    '<div class="card-top">' +
      '<span class="drag-handle" title="Glisser">&#11811;</span>' +
      '<div class="pill"><div class="dot d-load" id="dot-' + t.id + '"></div>' +
      '<span id="st-' + t.id + '" style="color:var(--grey)">Chargement...</span></div>' +
      '<span class="obadge" id="ob-' + t.id + '">#' + idx + '</span>' +
    '</div>' +
    '<div class="card-url">' + t.handle + '/status/' + t.id + '</div>' +
    '<div class="card-body" id="cb-' + t.id + '"><div class="ph"><div class="spin"></div><span>Recuperation...</span></div></div>' +
    '<div class="card-actions">' +
      '<button class="bs" id="ssb-' + t.id + '" disabled>&#128247; Screenshot</button>' +
      '<button class="bs" id="dlb-' + t.id + '" style="display:none">&#8659; PNG</button>' +
    '</div>';
  grid.appendChild(d);

  document.getElementById("ssb-" + t.id).addEventListener("click", function() { captureOne(t.id); });
  document.getElementById("dlb-" + t.id).addEventListener("click", function() { dlOne(t.id); });

  initDrag(d);
}

function initDrag(card) {
  card.addEventListener("dragstart", function(e) {
    dragSrc = card; card.classList.add("dragging"); e.dataTransfer.effectAllowed = "move";
  });
  card.addEventListener("dragend", function() {
    card.classList.remove("dragging");
    document.querySelectorAll(".card").forEach(function(c) { c.classList.remove("drag-over"); });
  });
  card.addEventListener("dragover", function(e) {
    e.preventDefault();
    if (card !== dragSrc) {
      document.querySelectorAll(".card").forEach(function(c) { c.classList.remove("drag-over"); });
      card.classList.add("drag-over");
    }
  });
  card.addEventListener("drop", function(e) {
    e.preventDefault();
    if (!dragSrc || dragSrc === card) return;
    var grid = document.getElementById("grid");
    var cards = Array.from(grid.querySelectorAll(".card"));
    if (cards.indexOf(dragSrc) < cards.indexOf(card)) grid.insertBefore(dragSrc, card.nextSibling);
    else grid.insertBefore(dragSrc, card);
    card.classList.remove("drag-over");
    tweetOrder = Array.from(grid.querySelectorAll(".card")).map(function(c) { return c.dataset.id; });
    tweetOrder.forEach(function(id, i) {
      var ob = document.getElementById("ob-" + id); if (ob) ob.textContent = "#" + (i+1);
    });
    updateUI();
  });
}

function fetchTweet(t) {
  var id = t.id; var handle = t.handle;
  Promise.all([
    fetch("/api/oembed?id=" + id).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; }),
    fetch("/api/tweet?id=" + id).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; })
  ]).then(function(results) {
    var oe = results[0]; var td = results[1];
    var name = handle, ah = handle, dateStr = "", text = "";

    if (oe && oe.author_name) { name = oe.author_name; }
    if (oe && oe.author_url) { ah = oe.author_url.split("/").pop() || handle; }
    if (oe && oe.html) {
      var doc = new DOMParser().parseFromString(oe.html, "text/html");
      var bq = doc.querySelector("blockquote");
      if (bq) {
        var ps = bq.querySelectorAll("p");
        if (ps.length) {
          text = ps[0].innerHTML
            .replace(/<br\s*\/?>/gi, "
")
            .replace(/<a[^>]+>([^<]*)<\/a>/gi, "$1")
            .replace(/<[^>]+>/g, "")
            .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
            .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
            .replace(/\s*pic\.twitter\.com\/\S+/g, "")
            .replace(/\s*https:\/\/t\.co\/\S+/g, "").trim();
        }
        bq.querySelectorAll("a").forEach(function(a) {
          if (a.href && a.href.indexOf("/status/") !== -1) dateStr = a.textContent;
        });
      }
    }

    var images = []; var likes = 0;
    if (td) {
      images = td.images || [];
      likes = td.favorite_count || 0;
      if (td.user) { name = td.user.name || name; ah = td.user.screen_name || ah; }
      if (td.text && !text) {
        text = td.text.replace(/\s*https:\/\/t\.co\/\S+/g, "").replace(/\s*pic\.twitter\.com\/\S+/g, "").trim();
      }
    }

    var parsed = { id:id, handle:ah, name:name, text:text, dateStr:dateStr, images:images, likes:likes };
    cache[id] = parsed;
    document.getElementById("cb-" + id).innerHTML = buildPreview(parsed);
    setStatus(id, "ok", "Pret");
    document.getElementById("ssb-" + id).disabled = false;
    updateUI();
  }).catch(function(e) {
    console.error(id, e);
    document.getElementById("cb-" + id).innerHTML = '<div style="padding:16px;text-align:center;color:var(--red)">Erreur</div>';
    setStatus(id, "err", "Erreur");
  });
}

function fmt(n) { return n >= 1000 ? (n/1000).toFixed(1) + "K" : String(n || 0); }

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function linkify(t) {
  return esc(t)
    .replace(/(#[\w]+)/g, '<span class="bl">$1</span>')
    .replace(/(@\w+)/g, '<span class="bl">$1</span>');
}

function buildImgs(images, large) {
  if (!images || !images.length) return "";
  var n = Math.min(images.length, 4);
  var h1 = large ? "max-height:280px;border-radius:14px" : "max-height:220px;border-radius:10px";
  var h2 = large ? "height:185px" : "height:120px";
  var h3a = large ? "height:205px" : "height:140px";
  var h3b = large ? "height:175px" : "height:110px";
  var h4 = large ? "height:175px" : "height:120px";
  var cols = n === 1 ? "1fr" : "1fr 1fr";
  var inner = "";
  for (var i = 0; i < n; i++) {
    var h = n===1 ? h1 : n===2 ? h2 : n===3 ? (i===0 ? h3a : h3b) : h4;
    var gc = (n===3 && i===0) ? "grid-column:1/3;" : "";
    inner += '<img src="' + images[i] + '" crossorigin="anonymous" style="width:100%;object-fit:cover;display:block;' + h + ';' + gc + '" onerror="this.style.display='none'">';
  }
  var br = large ? "14" : "10";
  return '<div style="display:grid;gap:3px;grid-template-columns:' + cols + ';border-radius:' + br + 'px;overflow:hidden;margin-bottom:' + (large?14:10) + 'px">' + inner + '</div>';
}

function buildPreview(d) {
  return '<div class="tw">' +
    '<div class="tw-head">' +
      '<div class="tw-av"><img src="' + LOGO + '" onerror="this.parentElement.textContent='?'" alt=""></div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="tw-name">' + esc(d.name) + '<span class="tw-ck">&#10003;</span></div>' +
        '<div class="tw-handle">@' + esc(d.handle) + '</div>' +
      '</div>' +
      '<div class="tw-xlogo">&#120143;</div>' +
    '</div>' +
    '<div class="tw-body">' + linkify(d.text) + '</div>' +
    buildImgs(d.images, false) +
    (d.dateStr ? '<div class="tw-date">' + esc(d.dateStr) + '</div>' : '') +
    '<div class="tw-stats"><span class="tw-stat">&#128172; Repondre</span><span class="tw-stat">&#128156; ' + fmt(d.likes) + '</span></div>' +
  '</div>';
}

function buildCapture(d) {
  return '<div style="display:flex;align-items:flex-start;gap:11px;margin-bottom:13px">' +
      '<div style="width:48px;height:48px;border-radius:50%;overflow:hidden;flex-shrink:0">' +
        '<img src="' + LOGO + '" style="width:100%;height:100%;object-fit:cover;display:block" alt="" crossorigin="anonymous">' +
      '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="font-size:16px;font-weight:700;color:#e7e9ea;display:flex;align-items:center;gap:5px">' + esc(d.name) + '<span style="color:#1d9bf0">&#10003;</span></div>' +
        '<div style="font-size:14px;color:#71767b;margin-top:2px">@' + esc(d.handle) + '</div>' +
      '</div>' +
      '<div style="font-weight:900;font-size:24px;color:#e7e9ea;line-height:1">&#120143;</div>' +
    '</div>' +
    '<div style="font-size:17px;line-height:1.6;color:#e7e9ea;margin-bottom:14px;white-space:pre-wrap;word-break:break-word">' + linkify(d.text) + '</div>' +
    buildImgs(d.images, true) +
    (d.dateStr ? '<div style="font-size:13px;color:#71767b;padding-top:10px;border-top:1px solid #2f3336;margin-bottom:10px">' + esc(d.dateStr) + '</div>' : '') +
    '<div style="display:flex;gap:20px;padding-top:10px;border-top:1px solid #2f3336">' +
      '<span style="font-size:15px;color:#71767b">&#128172; Repondre</span>' +
      '<span style="font-size:15px;color:#71767b">&#128156; ' + fmt(d.likes) + '</span>' +
    '</div>';
}

function setStatus(id, type, text) {
  var dot = document.getElementById("dot-" + id);
  var st = document.getElementById("st-" + id);
  if (dot) dot.className = "dot " + (type==="ok" ? "d-ok" : type==="err" ? "d-err" : "d-load");
  if (st) { st.textContent = text; st.style.color = type==="ok" ? "var(--green)" : type==="err" ? "var(--red)" : "var(--grey)"; }
}

function renderFrame(id) {
  return new Promise(function(resolve, reject) {
    var d = cache[id];
    if (!d) { reject(new Error("no data")); return; }

    var stage = document.getElementById("stage");
    stage.innerHTML = "";

    var frame = document.createElement("div");
    frame.style.cssText = "width:405px;height:720px;overflow:hidden;position:relative;display:flex;flex-direction:column;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";

    var bg = document.createElement("div");
    bg.style.cssText = "position:absolute;inset:0;background:linear-gradient(170deg,#06111e 0%,#0d1b2e 45%,#111428 75%,#0a0e1a 100%)";
    var rmImg = document.createElement("img");
    rmImg.src = LOGO; rmImg.crossOrigin = "anonymous";
    rmImg.style.cssText = "position:absolute;width:300px;height:300px;top:50%;left:50%;transform:translate(-50%,-50%);object-fit:contain;opacity:0.07;filter:blur(1px)";
    bg.appendChild(rmImg);
    frame.appendChild(bg);

    var tl = document.createElement("div");
    tl.style.cssText = "position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(155,127,212,.8),rgba(201,168,76,.8),transparent);z-index:10";
    frame.appendChild(tl);

    var ctaTop = document.createElement("div");
    ctaTop.style.cssText = "position:relative;z-index:5;width:100%;padding:13px 18px 9px;text-align:center;flex-shrink:0";
    ctaTop.innerHTML = '<div style="font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#fff;text-shadow:0 0 20px rgba(155,127,212,.9);line-height:1.4">&#128156; ABONNE-TOI - ON VISE LES 10 000 MADRIDISTAS &#128156;</div>' +
      '<div style="font-size:10px;color:rgba(201,168,76,.9);margin-top:3px;font-weight:600;letter-spacing:.5px">@RMadrid_actu - L'ACTU DU REAL MADRID EN FRANCAIS</div>';
    frame.appendChild(ctaTop);

    var twZone = document.createElement("div");
    twZone.style.cssText = "position:relative;z-index:5;flex:1;overflow:hidden;padding:4px 16px 6px;display:flex;align-items:center";
    var twBox = document.createElement("div");
    twBox.style.cssText = "width:100%;background:#15202b;border:1px solid #2f3336;border-radius:16px;padding:18px 20px;overflow:hidden";
    twBox.innerHTML = buildCapture(d);
    twZone.appendChild(twBox);
    frame.appendChild(twZone);

    var ctaBot = document.createElement("div");
    ctaBot.style.cssText = "position:relative;z-index:5;width:100%;padding:8px 14px 6px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px";
    ctaBot.innerHTML =
      '<div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center">' +
        '<span style="font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:rgba(239,68,68,.18);color:#ff7070;border:1px solid rgba(239,68,68,.35)">&#10084; LIKE si tu es Madridista</span>' +
        '<span style="font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:rgba(29,155,240,.18);color:#60bfff;border:1px solid rgba(29,155,240,.35)">&#128228; PARTAGE a tes amis</span>' +
      '</div>' +
      '<span style="font-size:11px;font-weight:700;padding:5px 14px;border-radius:20px;background:rgba(201,168,76,.18);color:#F0D080;border:1px solid rgba(201,168,76,.4)">&#128276; ABONNE-TOI pour NE RIEN RATER SUR LE REAL MADRID</span>' +
      '<div style="background:linear-gradient(90deg,rgba(201,168,76,.1),rgba(201,168,76,.32),rgba(201,168,76,.1));border:1px solid rgba(201,168,76,.55);border-radius:12px;padding:6px 20px;display:flex;align-items:center;gap:10px;margin-top:2px">' +
        '<span style="font-size:16px;color:#F0D080;font-weight:900">&#9658;&#9658;</span>' +
        '<span style="font-size:14px;font-weight:800;color:#F0D080;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 10px rgba(201,168,76,.5)">SWIPE POUR LA SUITE</span>' +
        '<span style="font-size:16px;color:#F0D080;font-weight:900">&#9658;&#9658;</span>' +
      '</div>';
    frame.appendChild(ctaBot);

    var wm = document.createElement("div");
    wm.style.cssText = "position:relative;z-index:5;width:100%;height:36px;flex-shrink:0;background:linear-gradient(90deg,rgba(6,17,30,.98),rgba(17,20,40,.98),rgba(6,17,30,.98));border-top:1px solid rgba(155,127,212,.2);display:flex;align-items:center;justify-content:center;gap:8px";
    var wmL = document.createElement("img");
    wmL.src = LOGO; wmL.crossOrigin = "anonymous";
    wmL.style.cssText = "width:22px;height:22px;border-radius:50%;object-fit:cover";
    var wmT = document.createElement("span");
    wmT.style.cssText = "font-size:12px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.5px";
    wmT.textContent = "@RMadrid_actu";
    wm.appendChild(wmL); wm.appendChild(wmT);
    frame.appendChild(wm);
    stage.appendChild(frame);

    var imgs = Array.from(stage.querySelectorAll("img"));
    var pending = imgs.length;
    if (pending === 0) { doCapture(); return; }
    imgs.forEach(function(img) {
      if (img.complete) { pending--; if (pending === 0) doCapture(); return; }
      img.onload = function() { pending--; if (pending === 0) doCapture(); };
      img.onerror = function() { pending--; if (pending === 0) doCapture(); };
      setTimeout(function() { if (pending > 0) { pending = 0; doCapture(); } }, 3500);
    });

    function doCapture() {
      setTimeout(function() {
        html2canvas(frame, { backgroundColor:"#06111e", scale:3, useCORS:true, allowTaint:false, logging:false, width:405, height:720 })
          .then(function(canvas) { stage.innerHTML = ""; resolve(canvas.toDataURL("image/png")); })
          .catch(function(e) { stage.innerHTML = ""; reject(e); });
      }, 250);
    }
  });
}

function captureOne(id) {
  var btn = document.getElementById("ssb-" + id);
  btn.textContent = "..."; btn.disabled = true;
  renderFrame(id).then(function(dataUrl) {
    shots[id] = dataUrl;
    btn.textContent = "Capture OK";
    var dlb = document.getElementById("dlb-" + id);
    dlb.style.display = "inline-flex"; dlb.disabled = false;
    updateUI();
  }).catch(function(e) { console.error(e); btn.textContent = "Erreur"; btn.disabled = false; });
}

function captureAll() {
  var btn = document.getElementById("cap-btn");
  btn.textContent = "Capture..."; btn.disabled = true;
  var ids = Object.keys(cache);
  var i = 0;
  function next() {
    if (i >= ids.length) { btn.textContent = "Capturer tout"; btn.disabled = false; updateUI(); return; }
    var id = ids[i++];
    setStatus(id, "load", "Capture...");
    renderFrame(id).then(function(dataUrl) {
      shots[id] = dataUrl;
      setStatus(id, "ok", "Capture OK");
      var ssb = document.getElementById("ssb-" + id); if (ssb) ssb.textContent = "Capture OK";
      var dlb = document.getElementById("dlb-" + id); if (dlb) { dlb.style.display = "inline-flex"; dlb.disabled = false; }
      next();
    }).catch(function(e) { console.error(id, e); setStatus(id, "err", "Erreur"); next(); });
  }
  next();
}

function dlOne(id) {
  if (!shots[id]) return;
  var a = document.createElement("a"); a.href = shots[id]; a.download = "tweet_" + id + ".png"; a.click();
}

function dlZip() {
  var ids = tweetOrder.filter(function(id) { return shots[id]; });
  if (!ids.length) return;
  var btn = document.getElementById("dl-btn");
  btn.textContent = "ZIP..."; btn.disabled = true;
  var zip = new JSZip();
  var now = new Date();
  var dd = String(now.getDate()).padStart(2,"0");
  var mm = String(now.getMonth()+1).padStart(2,"0");
  var yyyy = now.getFullYear();
  var name = ids.length + "-screenshots_" + dd + "-" + mm + "-" + yyyy;
  var folder = zip.folder(name);
  ids.forEach(function(id, i) {
    folder.file(String(i+1).padStart(2,"0") + "_tweet_" + id + ".png", shots[id].split(",")[1], {base64:true});
  });
  zip.generateAsync({type:"blob"}).then(function(blob) {
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name + ".zip"; a.click();
    URL.revokeObjectURL(a.href);
    btn.textContent = "Telecharger ZIP"; btn.disabled = false;
  });
}

function updateUI() {
  var tl = Object.keys(cache).length;
  var ts = Object.keys(shots).length;
  var si = document.getElementById("sinfo");
  var cnt = document.getElementById("cnt");
  if (cnt) cnt.textContent = tweetOrder.length + " tweet" + (tweetOrder.length > 1 ? "s" : "");
  if (si) {
    if (tl === 0) si.innerHTML = "Aucun tweet charge";
    else if (ts === 0) si.innerHTML = "<strong>" + tl + "</strong> tweet(s) pret(s)";
    else si.innerHTML = "<strong>" + ts + "/" + tl + "</strong> screenshot(s) pret(s)";
  }
  document.getElementById("cap-btn").style.display = tl > 0 ? "inline-flex" : "none";
  document.getElementById("dl-btn").style.display = ts > 0 ? "inline-flex" : "none";
}

function clearAll() {
  document.getElementById("urls").value = "";
  document.getElementById("grid").innerHTML = "";
  document.getElementById("sec").style.display = "none";
  shots = {}; cache = {}; tweetOrder = [];
  updateUI();
}
</script>
