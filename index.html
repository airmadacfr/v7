<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweet Screenshot</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--gold:#C9A84C;--gold-l:#F0D080;--dark:#0A0A0A;--d2:#111;--d3:#1A1A1A;--d4:#252525;--w:#F5F5F0;--grey:#888;--green:#22C55E;--red:#EF4444;--tb:#15202b;--tbr:#2f3336;--tt:#e7e9ea;--tm:#71767b;--tbl:#1d9bf0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--dark);color:var(--w);font-family:"DM Sans",sans-serif;min-height:100vh}
.hdr{border-bottom:1px solid #222;padding:16px 32px;display:flex;align-items:center;gap:14px;background:var(--d2)}
.hdr-logo{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0}
.hdr-logo img{width:100%;height:100%;object-fit:cover}
.hdr-t{font-family:"Bebas Neue",sans-serif;font-size:20px;letter-spacing:1px}
.hdr-s{font-size:11px;color:var(--grey);margin-top:1px}
.main{max-width:920px;margin:0 auto;padding:28px 22px 110px}
.info{background:#0d0d00;border:1px solid #2a2500;border-left:3px solid var(--gold);border-radius:8px;padding:11px 16px;font-size:12px;color:#999;line-height:1.8;margin-bottom:22px}
.info strong{color:var(--gold-l)}
.paste-box{background:var(--d2);border:1.5px dashed #2e2e2e;border-radius:12px;padding:18px;margin-bottom:16px}
.lbl{font-size:11px;color:var(--grey);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
textarea{width:100%;background:var(--d3);border:1px solid #2a2a2a;border-radius:8px;padding:11px 14px;color:var(--w);font-family:"DM Sans",sans-serif;font-size:14px;resize:vertical;min-height:96px;outline:none;line-height:1.6}
.hint{font-size:11px;color:#555;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.bp{background:var(--gold);color:var(--dark);border:none;border-radius:8px;padding:11px 22px;font-family:"DM Sans",sans-serif;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.bp:hover{background:var(--gold-l)}
.bp:disabled{opacity:.4;cursor:not-allowed}
.bs{background:var(--d4);color:var(--w);border:1px solid #333;border-radius:8px;padding:9px 16px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bs:hover{border-color:var(--gold);color:var(--gold)}
.bs:disabled{opacity:.4;cursor:not-allowed}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-t{font-family:"Bebas Neue",sans-serif;font-size:19px;letter-spacing:1px;color:var(--gold)}
.bdg{background:var(--d3);padding:3px 11px;border-radius:20px;font-size:12px;color:var(--grey)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--d2);border:1px solid #1e1e1e;border-radius:13px;overflow:hidden;cursor:grab;user-select:none}
.card.dragging{opacity:.4}
.card.drag-over{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.card-top{padding:11px 14px 3px;display:flex;align-items:center;gap:6px}
.drag-handle{color:#444;font-size:14px;cursor:grab;padding:2px 4px}
.pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500}
.obadge{margin-left:auto;background:var(--d4);color:var(--grey);font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-load{background:var(--gold);animation:pulse 1s infinite}
.d-ok{background:var(--green)}
.d-err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.card-url{padding:0 14px 7px;font-size:10px;color:#383838;font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body{padding:6px 10px 8px}
.card-actions{padding:8px 14px 12px;border-top:1px solid #191919;display:flex;gap:7px;flex-wrap:wrap}
.ph{padding:26px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;color:#555;font-size:12px}
.spin{width:20px;height:20px;border:2px solid #222;border-top-color:var(--gold);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{background:var(--tb);border:1px solid var(--tbr);border-radius:12px;padding:14px 16px;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;width:100%}
.tw-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px}
.tw-av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#273340}
.tw-av img{width:100%;height:100%;object-fit:cover;display:block}
.tw-names{flex:1;min-width:0}
.tw-name{font-size:13px;font-weight:700;color:var(--tt);display:flex;align-items:center;gap:4px}
.tw-ck{color:var(--tbl);font-size:13px}
.tw-handle{font-size:12px;color:var(--tm);margin-top:1px}
.tw-xlogo{font-weight:900;font-size:18px;color:var(--tt);margin-left:auto;flex-shrink:0}
.tw-body{font-size:13px;line-height:1.5;color:var(--tt);margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.bl{color:var(--tbl)}
.tw-date{font-size:11px;color:var(--tm);padding-top:8px;border-top:1px solid var(--tbr);margin-bottom:8px}
.tw-stats{display:flex;gap:14px;padding-top:8px;border-top:1px solid var(--tbr)}
.tw-stat{font-size:12px;color:var(--tm)}
.sticky{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.97);border-top:1px solid #222;backdrop-filter:blur(12px);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:200}
.sinfo{font-size:13px;color:var(--grey)}
.sinfo strong{color:var(--w)}
.sticky-r{display:flex;gap:8px;flex-shrink:0}
.toast{position:fixed;top:20px;right:20px;background:var(--d2);border:1px solid var(--gold);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--w);transform:translateY(-80px);opacity:0;transition:all .3s;z-index:300}
.toast.show{transform:translateY(0);opacity:1}
#stage{position:fixed;left:-9999px;top:0;width:1080px;background:transparent;z-index:-1;pointer-events:none}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;padding:20px 16px 40px}
.modal-bg.open{display:flex}
.modal-bar{width:100%;max-width:680px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-shrink:0}
.modal-title{font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:1px;color:var(--gold)}
.modal-acts{display:flex;gap:8px}
.modal-img{max-width:680px;width:100%;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.7)}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-logo"><img src="/logo.png" alt="Logo"></div>
  <div>
    <div class="hdr-t">Tweet Screenshot Tool</div>
    <div class="hdr-s">@RMadrid_actu</div>
  </div>
</div>
<div class="main">
  <div class="info">
    <strong>Mode d'emploi :</strong> Colle tes liens, clique Charger, puis Capturer tout.<br>
    Drag &amp; drop pour reordonner. ZIP avec date automatique.
  </div>
  <div class="paste-box">
    <div class="lbl">Liens de tweets</div>
    <textarea id="urls" placeholder="https://x.com/RMadrid_actu/status/..."></textarea>
    <div class="hint">Un lien par ligne. x.com et twitter.com acceptes.</div>
  </div>
  <div class="row">
    <button class="bp" id="btn-load">&#128640; Charger les tweets</button>
    <button class="bs" id="btn-clear">&#128465; Effacer</button>
  </div>
  <div id="sec" style="display:none">
    <div class="sec-hdr">
      <span class="sec-t">Tweets</span>
      <span class="bdg" id="cnt"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div id="modal-bg" class="modal-bg"><div class="modal-bar"><span class="modal-title" id="modal-title">PREVIEW</span><div class="modal-acts"><button class="bs" id="modal-dl">&#8659; PNG</button><button class="bs" id="modal-close">&#10005; Fermer</button></div></div><img class="modal-img" id="modal-img" src="" alt="preview"></div>
<div id="stage"></div>
<div class="toast" id="toast">Lien detecte !</div>
<div class="sticky">
  <div class="sinfo" id="sinfo">Aucun tweet charge</div>
  <div class="sticky-r">
    <button class="bs" id="cap-btn" style="display:none">&#128247; Capturer tout</button>
    <button class="bp" id="dl-btn" style="display:none">&#8659; Telecharger ZIP</button>
  </div>
</div>
<script>
var LOGO = "/logo.png";
var shots = {};
var cache = {};
var tweetOrder = [];
var dragSrc = null;

document.getElementById("btn-load").addEventListener("click", loadAll);
document.getElementById("btn-clear").addEventListener("click", clearAll);
document.getElementById("cap-btn").addEventListener("click", captureAll);
document.getElementById("dl-btn").addEventListener("click", dlZip);
document.getElementById("modal-close").addEventListener("click", function() { document.getElementById("modal-bg").classList.remove("open"); });
document.getElementById("modal-bg").addEventListener("click", function(e) { if (e.target === this) { this.classList.remove("open"); } });

window.addEventListener("focus", tryPaste);
document.addEventListener("visibilitychange", function() {
  if (!document.hidden) { tryPaste(); }
});

function tryPaste() {
  if (!navigator.clipboard || !navigator.clipboard.readText) { return; }
  navigator.clipboard.readText().then(function(text) {
    if (!text) { return; }
    var re = /(?:twitter\.com|x\.com)\/[^\/]+\/status\/\d+/;
    if (!re.test(text)) { return; }
    var ta = document.getElementById("urls");
    var clean = text.split("?")[0].split("#")[0];
    if (ta.value.indexOf(clean) !== -1) { return; }
    ta.value = ta.value.trim() ? ta.value.trim() + "\n" + text.trim() : text.trim();
    showToast("Lien detecte et colle !");
  }).catch(function() {});
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 2800);
}

function parseUrls(raw) {
  var lines = raw.split("\n");
  var result = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) { continue; }
    var clean = line.split("?")[0].split("#")[0];
    var m = clean.match(/(?:twitter\.com|x\.com)\/([^\/]+)\/status\/(\d+)/);
    if (m) { result.push({ id: m[2], handle: m[1] }); }
  }
  return result;
}

function loadAll() {
  var raw = document.getElementById("urls").value;
  var tweets = parseUrls(raw);
  if (!tweets.length) { alert("Aucun lien valide trouve."); return; }
  document.getElementById("grid").innerHTML = "";
  document.getElementById("sec").style.display = "block";
  shots = {};
  cache = {};
  tweetOrder = [];
  for (var i = 0; i < tweets.length; i++) { tweetOrder.push(tweets[i].id); }
  updateUI();
  for (var j = 0; j < tweets.length; j++) {
    makeCard(tweets[j]);
    fetchTweet(tweets[j]);
  }
}

function makeCard(t) {
  var grid = document.getElementById("grid");
  var card = document.createElement("div");
  card.className = "card";
  card.id = "c-" + t.id;
  card.draggable = true;
  card.dataset.id = t.id;
  var idx = tweetOrder.indexOf(t.id) + 1;
  card.innerHTML =
    '<div class="card-top">' +
      '<span class="drag-handle">&#11811;</span>' +
      '<div class="pill">' +
        '<div class="dot d-load" id="dot-' + t.id + '"></div>' +
        '<span id="st-' + t.id + '" style="color:var(--grey)">Chargement...</span>' +
      '</div>' +
      '<span class="obadge" id="ob-' + t.id + '">#' + idx + '</span>' +
    '</div>' +
    '<div class="card-url">' + t.handle + '/status/' + t.id + '</div>' +
    '<div class="card-body" id="cb-' + t.id + '">' +
      '<div class="ph"><div class="spin"></div><span>Recuperation...</span></div>' +
    '</div>' +
    '<div class="card-actions">' +
      '<button class="bs" id="ssb-' + t.id + '" disabled>&#128247; Screenshot</button>' +
      '<button class="bs" id="pvb-' + t.id + '" disabled>&#128065; Preview</button>' +
      '<button class="bs" id="dlb-' + t.id + '" style="display:none">&#8659; PNG</button>' +
    '</div>';
  grid.appendChild(card);
  (function(id) {
    document.getElementById("ssb-" + id).addEventListener("click", function() { captureOne(id); });
    document.getElementById("pvb-" + id).addEventListener("click", function() { previewOne(id); });
    document.getElementById("dlb-" + id).addEventListener("click", function() { dlOne(id); });
  })(t.id);
  initDrag(card);
}

function initDrag(card) {
  card.addEventListener("dragstart", function(e) {
    dragSrc = card;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  });
  card.addEventListener("dragend", function() {
    card.classList.remove("dragging");
    var all = document.querySelectorAll(".card");
    for (var i = 0; i < all.length; i++) { all[i].classList.remove("drag-over"); }
  });
  card.addEventListener("dragover", function(e) {
    e.preventDefault();
    if (card !== dragSrc) {
      var all = document.querySelectorAll(".card");
      for (var i = 0; i < all.length; i++) { all[i].classList.remove("drag-over"); }
      card.classList.add("drag-over");
    }
  });
  card.addEventListener("drop", function(e) {
    e.preventDefault();
    if (!dragSrc || dragSrc === card) { return; }
    var grid = document.getElementById("grid");
    var cards = grid.querySelectorAll(".card");
    var srcIdx = -1, tgtIdx = -1;
    for (var i = 0; i < cards.length; i++) {
      if (cards[i] === dragSrc) { srcIdx = i; }
      if (cards[i] === card) { tgtIdx = i; }
    }
    if (srcIdx < tgtIdx) { grid.insertBefore(dragSrc, card.nextSibling); }
    else { grid.insertBefore(dragSrc, card); }
    card.classList.remove("drag-over");
    tweetOrder = [];
    var newCards = grid.querySelectorAll(".card");
    for (var j = 0; j < newCards.length; j++) {
      tweetOrder.push(newCards[j].dataset.id);
      var ob = document.getElementById("ob-" + newCards[j].dataset.id);
      if (ob) { ob.textContent = "#" + (j + 1); }
    }
    updateUI();
  });
}

function fetchTweet(t) {
  var id = t.id;
  var handle = t.handle;
  var p1 = fetch("/api/oembed?id=" + id).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
  var p2 = fetch("/api/tweet?id=" + id).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
  Promise.all([p1, p2]).then(function(res) {
    var oe = res[0];
    var td = res[1];
    var name = handle, ah = handle, dateStr = "", text = "";
    if (oe) {
      if (oe.author_name) { name = oe.author_name; }
      if (oe.author_url) { ah = oe.author_url.split("/").pop() || handle; }
      if (oe.html) {
        var doc = new DOMParser().parseFromString(oe.html, "text/html");
        var bq = doc.querySelector("blockquote");
        if (bq) {
          var ps = bq.querySelectorAll("p");
          if (ps.length) {
            var raw = ps[0].innerHTML;
            raw = raw.replace(/<br\s*\/?>/gi, "\n");
            raw = raw.replace(/<a[^>]+>([^<]*)<\/a>/gi, "$1");
            raw = raw.replace(/<[^>]+>/g, "");
            raw = raw.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'");
            raw = raw.replace(/\s*pic\.twitter\.com\/\S+/g, "");
            raw = raw.replace(/\s*https:\/\/t\.co\/\S+/g, "");
            text = raw.trim();
          }
          var links = bq.querySelectorAll("a");
          for (var i = 0; i < links.length; i++) {
            if (links[i].href && links[i].href.indexOf("/status/") !== -1) {
              dateStr = links[i].textContent;
            }
          }
        }
      }
    }
    var images = [], likes = 0;
    if (td) {
      images = td.images || [];
      likes = td.favorite_count || 0;
      if (td.user) { name = td.user.name || name; ah = td.user.screen_name || ah; }
      if (td.text && !text) {
        var t2 = td.text.replace(/\s*https:\/\/t\.co\/\S+/g, "").replace(/\s*pic\.twitter\.com\/\S+/g, "");
        text = t2.trim();
      }
    }
    var parsed = { id: id, handle: ah, name: name, text: text, dateStr: dateStr, images: images, likes: likes };
    cache[id] = parsed;
    document.getElementById("cb-" + id).innerHTML = buildPreview(parsed);
    setStatus(id, "ok", "Pret");
    document.getElementById("ssb-" + id).disabled = false;
    document.getElementById("pvb-" + id).disabled = false;
    updateUI();
  }).catch(function(e) {
    console.error(id, e);
    document.getElementById("cb-" + id).innerHTML = '<div style="padding:16px;text-align:center;color:var(--red)">Erreur chargement</div>';
    setStatus(id, "err", "Erreur");
  });
}

function fmtNum(n) {
  if (n >= 1000) { return (n / 1000).toFixed(1) + "K"; }
  return String(n || 0);
}

function escHtml(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function linkify(t) {
  var s = escHtml(t);
  s = s.replace(/(#[\w]+)/g, '<span class="bl">$1</span>');
  s = s.replace(/(@\w+)/g, '<span class="bl">$1</span>');
  return s;
}

function buildImgGrid(images, large) {
  if (!images || !images.length) { return ""; }
  var n = Math.min(images.length, 4);
  var br = large ? "14" : "10";
  var mb = large ? "16" : "10";
  var html = "";
  if (n === 1) {
    html = '<div style="border-radius:' + br + 'px;overflow:hidden;margin-bottom:' + mb + 'px">';
    html += '<img src="' + images[0] + '" crossorigin="anonymous" style="width:100%;height:auto;display:block" onerror="this.style.display=\'none\'">';
    html += "</div>";
  } else {
    html = '<div style="display:grid;gap:3px;grid-template-columns:1fr 1fr;border-radius:' + br + 'px;overflow:hidden;margin-bottom:' + mb + 'px">';
    for (var i = 0; i < n; i++) {
      var gc = (n === 3 && i === 0) ? "grid-column:1/3;" : "";
      html += '<img src="' + images[i] + '" crossorigin="anonymous" style="width:100%;height:auto;display:block;' + gc + '" onerror="this.style.display=\'none\'">';
    }
    html += "</div>";
  }
  return html;
}

function buildPreview(d) {
  return '<div class="tw">' +
    '<div class="tw-head">' +
      '<div class="tw-av"><img src="' + LOGO + '" alt="" onerror="this.parentElement.textContent=\'?\'" ></div>' +
      '<div class="tw-names">' +
        '<div class="tw-name">' + escHtml(d.name) + '<span class="tw-ck">&#10003;</span></div>' +
        '<div class="tw-handle">@' + escHtml(d.handle) + '</div>' +
      '</div>' +
      '<div class="tw-xlogo">&#120143;</div>' +
    '</div>' +
    '<div class="tw-body">' + linkify(d.text) + '</div>' +
    buildImgGrid(d.images, false) +
    '' +
    '' +
  '</div>';
}

function buildCaptureInner(d) {
  return '<div style="display:flex;align-items:flex-start;gap:24px;margin-bottom:24px">' +
    '<div style="width:96px;height:96px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#273340">' +
      '<img src="' + LOGO + '" style="width:100%;height:100%;object-fit:cover;display:block" alt="" crossorigin="anonymous">' +
    '</div>' +
    '<div style="flex:1;min-width:0">' +
      '<div style="font-size:34px;font-weight:700;color:#e7e9ea;display:flex;align-items:center;gap:10px">' +
        escHtml(d.name) + '<span style="color:#1d9bf0;font-size:34px">&#10003;</span>' +
      '</div>' +
      '<div style="font-size:27px;color:#71767b;margin-top:5px">@' + escHtml(d.handle) + '</div>' +
    '</div>' +
    '<div style="font-weight:900;font-size:50px;color:#e7e9ea;line-height:1;flex-shrink:0">&#120143;</div>' +
  '</div>' +
  '<div style="font-size:36px;line-height:1.6;color:#e7e9ea;margin-bottom:28px;white-space:pre-wrap;word-break:break-word">' + linkify(d.text) + '</div>' +
  (d.images && d.images.length ? '<div style="width:75%;margin:0 auto">' + buildImgGrid(d.images, true) + '</div>' : '') +
  '' +
  '';
}

function setStatus(id, type, text) {
  var dot = document.getElementById("dot-" + id);
  var st = document.getElementById("st-" + id);
  if (dot) { dot.className = "dot " + (type === "ok" ? "d-ok" : type === "err" ? "d-err" : "d-load"); }
  if (st) { st.textContent = text; st.style.color = type === "ok" ? "var(--green)" : type === "err" ? "var(--red)" : "var(--grey)"; }
}

function renderFrame(id, slideNum, slideTotal) {
  return new Promise(function(resolve, reject) {
    var d = cache[id];
    if (!d) { reject(new Error("no data")); return; }
    var stage = document.getElementById("stage");
    stage.innerHTML = "";

    /* -- OUTER WRAPPER: width fixed, height auto -- */
    var wrap = document.createElement("div");
    wrap.style.cssText = "width:1080px;background:linear-gradient(170deg,#06111e 0%,#0d1b2e 45%,#111428 75%,#0a0e1a 100%);position:relative;padding:0 0 0 0";

    /* accent line top */
    var tl = document.createElement("div");
    tl.style.cssText = "width:100%;height:6px;background:linear-gradient(90deg,transparent,rgba(155,127,212,.85),rgba(201,168,76,.85),transparent)";
    wrap.appendChild(tl);

    /* slide numbering badge */
    if (slideNum && slideTotal) {
      var badge = document.createElement("div");
      badge.style.cssText = "position:absolute;top:18px;right:32px;background:rgba(201,168,76,.18);border:2px solid rgba(201,168,76,.7);border-radius:40px;padding:8px 28px;font-size:28px;font-weight:700;color:rgba(201,168,76,.95);font-family:-apple-system,sans-serif;letter-spacing:1px;z-index:10;line-height:1";
      badge.textContent = slideNum + " / " + slideTotal;
      wrap.appendChild(badge);
    }

    /* RM logo watermark behind content */
    var rmBg = document.createElement("img");
    rmBg.src = LOGO;
    rmBg.crossOrigin = "anonymous";
    rmBg.style.cssText = "position:absolute;width:700px;height:700px;top:50%;left:50%;transform:translate(-50%,-50%);object-fit:contain;opacity:0.06;pointer-events:none";
    wrap.appendChild(rmBg);

    /* CTA TOP */
    var ctaTop = document.createElement("div");
    ctaTop.style.cssText = "width:100%;padding:36px 50px 24px;text-align:center";
    ctaTop.innerHTML =
      '<div style="font-size:34px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#fff;line-height:1.4">' +
        '&#129293; ABONNE-TOI - ON VISE LES 10 000 MADRIDISTAS &#129293;' +
      '</div>' +
      '<div style="font-size:28px;color:rgba(201,168,76,.9);margin-top:8px;font-weight:600;letter-spacing:.5px">' +
        '&#128242; @RMadrid_actu - L\'ACTU DU REAL MADRID EN FRANCAIS' +
      '</div>';
    wrap.appendChild(ctaTop);

    /* TWEET BOX */
    var twPad = document.createElement("div");
    twPad.style.cssText = "padding:16px 50px 32px;position:relative;z-index:1";
    var twBox = document.createElement("div");
    twBox.style.cssText = "background:#15202b;border:2px solid #2f3336;border-radius:42px;padding:48px 56px";
    twBox.innerHTML = buildCaptureInner(d);
    twPad.appendChild(twBox);
    wrap.appendChild(twPad);

    /* WATERMARK BAR */
    var wm = document.createElement("div");
    wm.style.cssText = "width:100%;padding:22px 40px 28px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(155,127,212,.2)";
    var wmLeft = document.createElement("div");
    wmLeft.style.cssText = "display:flex;align-items:center;gap:20px";
    var wmL = document.createElement("img");
    wmL.src = LOGO;
    wmL.crossOrigin = "anonymous";
    wmL.style.cssText = "width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0";
    var wmT = document.createElement("span");
    wmT.style.cssText = "font-size:32px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:1px;font-family:-apple-system,sans-serif";
    wmT.textContent = "@RMadrid_actu";
    wmLeft.appendChild(wmL);
    wmLeft.appendChild(wmT);
    wm.appendChild(wmLeft);
    var swipe = document.createElement("div");
    swipe.style.cssText = "display:flex;align-items:center;gap:14px;background:rgba(201,168,76,.15);border:2px solid rgba(201,168,76,.6);border-radius:60px;padding:16px 28px";
    var swipeT = document.createElement("span");
    swipeT.style.cssText = "font-size:26px;font-weight:700;color:rgba(201,168,76,.95);letter-spacing:1px;font-family:-apple-system,sans-serif;text-transform:uppercase";
    swipeT.textContent = "SWIPE";
    var swipeArrow = document.createElement("span");
    swipeArrow.style.cssText = "font-size:38px;color:rgba(201,168,76,.95);line-height:1;display:flex;align-items:center";
    swipeArrow.innerHTML = "&#10132;";
    swipe.appendChild(swipeT);
    swipe.appendChild(swipeArrow);
    wm.appendChild(swipe);
    wrap.appendChild(wm);

    stage.appendChild(wrap);

    /* wait for images then capture */
    var imgs = stage.querySelectorAll("img");
    var pending = imgs.length;
    function doCapture() {
      setTimeout(function() {
        html2canvas(wrap, {
          backgroundColor: "#06111e",
          scale: 1,
          useCORS: true,
          allowTaint: false,
          logging: false,
          width: 1080,
          height: wrap.scrollHeight
        }).then(function(canvas) {
          stage.innerHTML = "";
          resolve(canvas.toDataURL("image/png"));
        }).catch(function(e) {
          stage.innerHTML = "";
          reject(e);
        });
      }, 300);
    }
    if (pending === 0) { doCapture(); return; }
    for (var i = 0; i < imgs.length; i++) {
      (function(img) {
        if (img.complete) { pending--; if (pending === 0) { doCapture(); } return; }
        img.onload = function() { pending--; if (pending === 0) { doCapture(); } };
        img.onerror = function() { pending--; if (pending === 0) { doCapture(); } };
      })(imgs[i]);
    }
    setTimeout(doCapture, 4000);
  });
}

function captureOne(id) {
  var btn = document.getElementById("ssb-" + id);
  btn.textContent = "..."; btn.disabled = true;
  var total = tweetOrder.filter(function(i) { return !!cache[i]; }).length;
  var num = tweetOrder.indexOf(id) + 1;
  renderFrame(id, num, total).then(function(dataUrl) {
    shots[id] = dataUrl; btn.textContent = "OK";
    var dlb = document.getElementById("dlb-" + id);
    dlb.style.display = "inline-flex"; dlb.disabled = false;
    updateUI();
  }).catch(function(e) { console.error(e); btn.textContent = "Erreur"; btn.disabled = false; });
}

function previewOne(id) {
  var pvb = document.getElementById("pvb-" + id);
  pvb.textContent = "..."; pvb.disabled = true;
  var total = tweetOrder.filter(function(i) { return !!cache[i]; }).length;
  var num = tweetOrder.indexOf(id) + 1;
  renderFrame(id, num, total).then(function(dataUrl) {
    shots[id] = dataUrl;
    pvb.disabled = false;
    pvb.innerHTML = "&#128065; Preview";
    var dlb = document.getElementById("dlb-" + id);
    if (dlb) { dlb.style.display = "inline-flex"; dlb.disabled = false; }
    updateUI();
    var modal = document.getElementById("modal-bg");
    var mImg = document.getElementById("modal-img");
    var mTitle = document.getElementById("modal-title");
    var mDl = document.getElementById("modal-dl");
    mImg.src = dataUrl;
    mTitle.textContent = "PREVIEW  " + num + " / " + total;
    mDl.onclick = function() {
      var a = document.createElement("a");
      a.href = dataUrl;
      a.download = "tweet_" + id + ".png";
      a.click();
    };
    modal.classList.add("open");
  }).catch(function(e) { console.error(e); pvb.innerHTML = "&#128065; Preview"; pvb.disabled = false; });
}

function captureAll() {
  var btn = document.getElementById("cap-btn");
  btn.textContent = "Capture..."; btn.disabled = true;
  var ids = tweetOrder.filter(function(id) { return !!cache[id]; });
  var total = ids.length;
  var idx = 0;
  function next() {
    if (idx >= ids.length) { btn.textContent = "Capturer tout"; btn.disabled = false; updateUI(); return; }
    var id = ids[idx];
    var num = idx + 1;
    idx++;
    setStatus(id, "load", "Capture...");
    renderFrame(id, num, total).then(function(dataUrl) {
      shots[id] = dataUrl; setStatus(id, "ok", "OK");
      var ssb = document.getElementById("ssb-" + id); if (ssb) { ssb.textContent = "OK"; }
      var dlb = document.getElementById("dlb-" + id); if (dlb) { dlb.style.display = "inline-flex"; dlb.disabled = false; }
      next();
    }).catch(function(e) { console.error(id, e); setStatus(id, "err", "Erreur"); next(); });
  }
  next();
}

function dlOne(id) {
  if (!shots[id]) { return; }
  var a = document.createElement("a"); a.href = shots[id]; a.download = "tweet_" + id + ".png"; a.click();
}

function dlZip() {
  var ids = [];
  for (var i = 0; i < tweetOrder.length; i++) { if (shots[tweetOrder[i]]) { ids.push(tweetOrder[i]); } }
  if (!ids.length) { return; }
  var btn = document.getElementById("dl-btn");
  btn.textContent = "ZIP..."; btn.disabled = true;
  var zip = new JSZip();
  var now = new Date();
  var dd = String(now.getDate()).padStart(2, "0");
  var mm = String(now.getMonth() + 1).padStart(2, "0");
  var yyyy = String(now.getFullYear());
  var name = ids.length + "-screenshots_" + dd + "-" + mm + "-" + yyyy;
  var folder = zip.folder(name);
  for (var j = 0; j < ids.length; j++) {
    var num = String(j + 1).padStart(2, "0");
    folder.file(num + "_tweet_" + ids[j] + ".png", shots[ids[j]].split(",")[1], { base64: true });
  }
  zip.generateAsync({ type: "blob" }).then(function(blob) {
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name + ".zip"; a.click();
    URL.revokeObjectURL(a.href); btn.textContent = "Telecharger ZIP"; btn.disabled = false;
  });
}

function updateUI() {
  var tl = Object.keys(cache).length;
  var ts = Object.keys(shots).length;
  var si = document.getElementById("sinfo");
  var cnt = document.getElementById("cnt");
  if (cnt) { cnt.textContent = tweetOrder.length + " tweet" + (tweetOrder.length > 1 ? "s" : ""); }
  if (si) {
    if (tl === 0) { si.innerHTML = "Aucun tweet charge"; }
    else if (ts === 0) { si.innerHTML = "<strong>" + tl + "</strong> tweet(s) pret(s)"; }
    else { si.innerHTML = "<strong>" + ts + "/" + tl + "</strong> screenshot(s) pret(s)"; }
  }
  document.getElementById("cap-btn").style.display = tl > 0 ? "inline-flex" : "none";
  document.getElementById("dl-btn").style.display = ts > 0 ? "inline-flex" : "none";
}

function clearAll() {
  document.getElementById("urls").value = "";
  document.getElementById("grid").innerHTML = "";
  document.getElementById("sec").style.display = "none";
  shots = {}; cache = {}; tweetOrder = []; updateUI();
}
</script>
</body>
